name: Lineup checks
on:
  push:
    branches: [main]
    paths: ['app/lineup/**', 'app/api/lineup/**', 'components/lineup/**', 'data/shiki-lineup.json', 'lib/lineup*.ts', 'public/downloads/lineup-monitor.gs', 'tests/lineup*.cjs', 'package*.json', '.github/workflows/lineup.yml']
  pull_request:
    paths: ['app/lineup/**', 'app/api/lineup/**', 'components/lineup/**', 'data/shiki-lineup.json', 'lib/lineup*.ts', 'public/downloads/lineup-monitor.gs', 'tests/lineup*.cjs', 'package*.json', '.github/workflows/lineup.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:lineup
      - run: npm run test:lineup-notifications
