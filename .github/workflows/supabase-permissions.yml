name: Supabase permissions

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/supabase-permissions.test.mjs'
      - 'package*.json'
      - '.github/workflows/supabase-permissions.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/supabase-permissions.test.mjs'
      - 'package*.json'
      - '.github/workflows/supabase-permissions.yml'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:supabase
