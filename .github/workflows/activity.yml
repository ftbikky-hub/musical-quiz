name: Activity records checks
on:
  push:
    branches: [main]
    paths: ['app/activity/**', 'app/api/activity/**', 'components/activity/**', 'lib/activity*.ts', 'data/japan-outline.json', 'tests/activity*.test.mjs', 'supabase/migrations/*activity*.sql', 'package*.json', '.github/workflows/activity.yml']
  pull_request:
    paths: ['app/activity/**', 'app/api/activity/**', 'components/activity/**', 'lib/activity*.ts', 'data/japan-outline.json', 'tests/activity*.test.mjs', 'supabase/migrations/*activity*.sql', 'package*.json', '.github/workflows/activity.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:activity
