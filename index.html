<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミュージカルクイズ</title>
<style>
  :root {
    --bg: #1b1023;
    --panel: #2a1a38;
    --panel-border: #45304f;
    --accent: #d9a441;
    --accent-dim: #a97e2f;
    --text: #f4ecf7;
    --text-dim: #c9b8d1;
    --correct: #4caf7d;
    --incorrect: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a1a38 0%, #170c20 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #241329; }
  .btn-primary:hover:not(:disabled) { background: #e6b458; }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    font-weight: 500;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--accent-dim); }

  .muted { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; }

  #screen-loading { text-align: center; color: var(--text-dim); padding: 40px 0; }

  #screen-start .card { text-align: center; }
  #screen-start h2 { margin-top: 0; }

  .progress {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .musical-tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #1f1329;
    color: var(--text);
    font-size: 0.98rem;
    cursor: pointer;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent-dim); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: rgba(76, 175, 125, 0.18); border-color: var(--correct); }
  .choice-btn.incorrect { background: rgba(217, 83, 79, 0.18); border-color: var(--incorrect); }

  .explanation {
    margin-top: 16px;
    padding: 12px 14px;
    background: #17101d;
    border-radius: 10px;
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .result-score {
    text-align: center;
    margin-bottom: 22px;
  }
  .result-score .big {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
  }
  .leaderboard { margin-top: 22px; }
  .leaderboard h3 { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 10px; }
  .leaderboard ol { margin: 0; padding-left: 22px; }
  .leaderboard li {
    padding: 6px 0;
    font-size: 0.92rem;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
  }
  .leaderboard li:last-child { border-bottom: none; }

  .error-toast {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(217, 83, 79, 0.15);
    border: 1px solid var(--incorrect);
    border-radius: 10px;
    font-size: 0.85rem;
    color: #f3c9c8;
  }
  .hidden { display: none !important; }
  .spacer { height: 14px; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎭 <span>ミュージカル</span>クイズ</h1>
    </header>

    <div id="screen-loading">
      <p>読み込み中...</p>
    </div>

    <div id="screen-start" class="hidden">
      <div class="card">
        <h2>クイズを始めよう</h2>
        <p class="muted">全10問の中からランダムで5問出題されます。ミュージカルの知識を試してみましょう。</p>

        <label for="input-player-name" class="muted" style="display:block;text-align:left;margin-bottom:6px;font-size:0.85rem;">
          お名前（入力するとランキングに載ります。空欄ならゲスト参加）
        </label>
        <input
          id="input-player-name"
          type="text"
          maxlength="20"
          placeholder="例）びっきぃ"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--panel-border);background:#1f1329;color:var(--text);font-size:0.98rem;margin-bottom:14px;"
        />

        <button id="btn-start-named" class="btn btn-primary" disabled>この名前でプレイ</button>
        <div class="spacer"></div>
        <button id="btn-start-guest" class="btn btn-secondary">ゲストとして始める</button>
        <div class="spacer"></div>
        <button id="btn-view-leaderboard" class="btn btn-secondary">ランキングを見る</button>
      </div>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="card">
        <div class="progress" id="quiz-progress">問題 1 / 5</div>
        <div class="musical-tag" id="quiz-musical"></div>
        <p class="question-text" id="quiz-question"></p>
        <div class="choices" id="quiz-choices"></div>
        <div class="explanation hidden" id="quiz-explanation"></div>
        <div class="spacer"></div>
        <button id="btn-next" class="btn btn-primary hidden">次へ</button>
      </div>
    </div>

    <div id="screen-result" class="hidden">
      <div class="card">
        <div class="result-score">
          <div class="muted">今回のスコア</div>
          <div class="big" id="result-score-value">0</div>
          <div class="muted" id="result-detail"></div>
        </div>
        <button id="btn-again" class="btn btn-primary">もう一度遊ぶ</button>
        <div class="leaderboard">
          <h3>🏆 ランキング（トップ5）</h3>
          <ol id="leaderboard-list"></ol>
        </div>
      </div>
    </div>

    <div id="error-box" class="error-toast hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";

    // ------------------------------------------------------------
    // 設定: あなたのSupabaseプロジェクトの情報
    // ------------------------------------------------------------
    var SUPABASE_URL = "https://vgmbcbseikcjkjxbyrjx.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_oNXZ4n-XITyKLgLRtKgVVw_UPokBcTL";
    var QUESTIONS_PER_ROUND = 5;

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ------------------------------------------------------------
    // DOM参照
    // ------------------------------------------------------------
    var el = {
      loading: document.getElementById("screen-loading"),
      start: document.getElementById("screen-start"),
      quiz: document.getElementById("screen-quiz"),
      result: document.getElementById("screen-result"),
      inputPlayerName: document.getElementById("input-player-name"),
      btnStartNamed: document.getElementById("btn-start-named"),
      btnStartGuest: document.getElementById("btn-start-guest"),
      btnViewLeaderboard: document.getElementById("btn-view-leaderboard"),
      btnAgain: document.getElementById("btn-again"),
      btnNext: document.getElementById("btn-next"),
      quizProgress: document.getElementById("quiz-progress"),
      quizMusical: document.getElementById("quiz-musical"),
      quizQuestion: document.getElementById("quiz-question"),
      quizChoices: document.getElementById("quiz-choices"),
      quizExplanation: document.getElementById("quiz-explanation"),
      resultScoreValue: document.getElementById("result-score-value"),
      resultDetail: document.getElementById("result-detail"),
      leaderboardList: document.getElementById("leaderboard-list"),
      errorBox: document.getElementById("error-box"),
    };

    var state = {
      playerName: null,
      questions: [],
      currentIndex: 0,
      correctCount: 0,
      sessionId: null,
      startedAt: null,
      pendingAnswers: [],
      answered: false,
    };

    function showScreen(name) {
      ["loading", "start", "quiz", "result"].forEach(function (key) {
        el[key].classList.toggle("hidden", key !== name);
      });
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      // 古いブラウザ向けの簡易フォールバック
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function showError(message) {
      el.errorBox.textContent = message;
      el.errorBox.classList.remove("hidden");
      window.setTimeout(function () {
        el.errorBox.classList.add("hidden");
      }, 6000);
    }

    function shuffle(array) {
      var copy = array.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    // ------------------------------------------------------------
    // 開始画面（名前入力 / ゲスト）
    // ------------------------------------------------------------
    el.inputPlayerName.addEventListener("input", function () {
      el.btnStartNamed.disabled = el.inputPlayerName.value.trim().length === 0;
    });

    el.inputPlayerName.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !el.btnStartNamed.disabled) {
        e.preventDefault();
        startQuiz(el.inputPlayerName.value.trim());
      }
    });

    el.btnStartNamed.addEventListener("click", function () {
      var name = el.inputPlayerName.value.trim();
      if (!name) return;
      startQuiz(name);
    });

    el.btnStartGuest.addEventListener("click", function () {
      startQuiz(null);
    });

    el.btnAgain.addEventListener("click", function () {
      el.inputPlayerName.value = state.playerName || "";
      el.btnStartNamed.disabled = !state.playerName;
      showScreen("start");
    });

    el.btnViewLeaderboard.addEventListener("click", function () {
      loadLeaderboard().then(function () {
        el.resultScoreValue.textContent = "-";
        el.resultDetail.textContent = "";
        showScreen("result");
      });
    });

    function startQuiz(playerName) {
      state.playerName = playerName;
      showScreen("loading");

      supabase
        .from("questions")
        .select("id, question_text, explanation, musicals(title), choices(id, choice_text, is_correct, sort_order)")
        .then(function (res) {
          if (res.error) throw res.error;
          if (!res.data || res.data.length === 0) {
            throw new Error("問題データが見つかりませんでした。");
          }
          var picked = shuffle(res.data).slice(0, QUESTIONS_PER_ROUND);
          picked.forEach(function (q) {
            q.choices = q.choices.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
          });
          state.questions = picked;
          state.currentIndex = 0;
          state.correctCount = 0;
          state.pendingAnswers = [];
          state.sessionId = generateUUID();
          state.startedAt = new Date().toISOString();

          renderQuestion();
          showScreen("quiz");
        })
        .catch(function (err) {
          showError("クイズの開始に失敗しました: " + err.message);
          showScreen("start");
        });
    }

    function renderQuestion() {
      state.answered = false;
      var q = state.questions[state.currentIndex];
      el.quizProgress.textContent = "問題 " + (state.currentIndex + 1) + " / " + state.questions.length;
      el.quizMusical.textContent = q.musicals ? q.musicals.title : "";
      el.quizQuestion.textContent = q.question_text;
      el.quizExplanation.classList.add("hidden");
      el.quizExplanation.textContent = "";
      el.btnNext.classList.add("hidden");

      el.quizChoices.innerHTML = "";
      shuffle(q.choices).forEach(function (choice) {
        var btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice.choice_text;
        btn.addEventListener("click", function () {
          selectChoice(q, choice, btn);
        });
        el.quizChoices.appendChild(btn);
      });
    }

    function selectChoice(question, choice, btnEl) {
      if (state.answered) return;
      state.answered = true;

      var buttons = el.quizChoices.querySelectorAll(".choice-btn");
      buttons.forEach(function (b) { b.disabled = true; });

      question.choices.forEach(function (c, idx) {
        if (c.is_correct) {
          var match = Array.prototype.find.call(buttons, function (b) { return b.textContent === c.choice_text; });
          if (match) match.classList.add("correct");
        }
      });
      if (!choice.is_correct) btnEl.classList.add("incorrect");
      if (choice.is_correct) state.correctCount += 1;

      if (question.explanation) {
        el.quizExplanation.textContent = question.explanation;
        el.quizExplanation.classList.remove("hidden");
      }
      el.btnNext.classList.remove("hidden");
      el.btnNext.textContent = state.currentIndex === state.questions.length - 1 ? "結果を見る" : "次へ";

      state.pendingAnswers.push({
        session_id: state.sessionId,
        question_id: question.id,
        selected_choice_id: choice.id,
        is_correct: choice.is_correct,
      });
    }

    el.btnNext.addEventListener("click", function () {
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        finishQuiz();
      }
    });

    function finishQuiz() {
      showScreen("loading");
      var score = state.correctCount * 20;

      function showResult() {
        el.resultScoreValue.textContent = score;
        el.resultDetail.textContent =
          state.correctCount + " / " + state.questions.length + " 問正解" +
          (state.playerName ? "" : "（ゲスト参加のためランキング対象外です）");
        showScreen("result");
      }

      supabase
        .from("quiz_sessions")
        .insert({
          id: state.sessionId,
          player_name: state.playerName,
          total_questions: state.questions.length,
          correct_count: state.correctCount,
          score: score,
          started_at: state.startedAt,
          finished_at: new Date().toISOString(),
        })
        .then(function (res) {
          if (res.error) throw res.error;
          if (state.pendingAnswers.length > 0) {
            return supabase.from("quiz_answers").insert(state.pendingAnswers);
          }
        })
        .then(function () {
          return loadLeaderboard();
        })
        .then(showResult)
        .catch(function (err) {
          showError("結果の保存に失敗しました: " + err.message);
          showResult();
        });
    }

    function loadLeaderboard() {
      return supabase
        .from("leaderboard")
        .select("*")
        .order("best_score", { ascending: false })
        .limit(5)
        .then(function (res) {
          el.leaderboardList.innerHTML = "";
          if (res.error || !res.data || res.data.length === 0) {
            var li = document.createElement("li");
            li.textContent = "まだ記録がありません";
            el.leaderboardList.appendChild(li);
            return;
          }
          res.data.forEach(function (row) {
            var li = document.createElement("li");
            var nameSpan = document.createElement("span");
            nameSpan.textContent = row.display_name || "プレイヤー";
            var scoreSpan = document.createElement("span");
            scoreSpan.textContent = row.best_score + "点";
            li.appendChild(nameSpan);
            li.appendChild(scoreSpan);
            el.leaderboardList.appendChild(li);
          });
        });
    }

    // ------------------------------------------------------------
    // 初期化
    // ------------------------------------------------------------
    showScreen("start");
  })();
  </script>
</body>
</html>
