<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミュージカルクイズ</title>
<style>
  :root {
    --bg: #1b1023;
    --panel: #2a1a38;
    --panel-border: #45304f;
    --accent: #d9a441;
    --accent-dim: #a97e2f;
    --text: #f4ecf7;
    --text-dim: #c9b8d1;
    --correct: #4caf7d;
    --incorrect: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a1a38 0%, #170c20 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }

  .bgm-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: -6px 0 20px;
    font-size: 0.82rem;
  }
  .bgm-bar-label { color: var(--text-dim); white-space: nowrap; }
  .bgm-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .bgm-pill:hover { border-color: var(--accent-dim); color: var(--text); }
  .bgm-pill.playing { color: var(--accent); border-color: var(--accent); background: rgba(217,164,65,0.1); }
  .bgm-pill .bgm-icon { display: inline-block; }
  .bgm-pill.playing .bgm-icon { animation: bgm-pulse 1.6s ease-in-out infinite; }
  .bgm-pill-stop { color: var(--text-dim); }
  @keyframes bgm-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.25); opacity: 0.65; }
  }

  .hero {
    position: relative;
    text-align: center;
    padding: 26px 10px 8px;
    margin-bottom: -4px;
    overflow: visible;
  }
  .hero-glow {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(217,164,65,0.28) 0%, rgba(217,164,65,0) 70%);
    pointer-events: none;
  }
  .hero-emoji {
    font-size: 2.6rem;
    display: inline-block;
    position: relative;
    animation: hero-float 4.5s ease-in-out infinite;
  }
  @keyframes hero-float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  .hero-notes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hero-notes span {
    position: absolute;
    font-size: 1.1rem;
    color: var(--accent);
    opacity: 0;
    animation: note-rise 6s ease-in infinite;
  }
  .hero-notes span:nth-child(1) { left: 18%; animation-delay: 0s; }
  .hero-notes span:nth-child(2) { left: 48%; animation-delay: 1.8s; font-size: 0.9rem; }
  .hero-notes span:nth-child(3) { left: 72%; animation-delay: 3.4s; }
  .hero-notes span:nth-child(4) { left: 32%; animation-delay: 5s; font-size: 0.85rem; }
  @keyframes note-rise {
    0% { transform: translateY(10px) translateX(0); opacity: 0; }
    15% { opacity: 0.85; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-80px) translateX(10px); opacity: 0; }
  }
  .hero-tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 6px 0 0;
    letter-spacing: 0.04em;
  }

  .difficulty-select {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .difficulty-pill {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .difficulty-pill:hover { border-color: var(--accent-dim); color: var(--text); }
  .difficulty-pill.selected {
    color: #241329;
    background: var(--accent);
    border-color: var(--accent);
  }

  #screen-tier-clear .card { text-align: center; }
  .tier-clear-emoji { font-size: 2.4rem; margin-bottom: 6px; }
  .result-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(217, 164, 65, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.95rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #241329; }
  .btn-primary:hover:not(:disabled) { background: #e6b458; }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    font-weight: 500;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--accent-dim); }

  .muted { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; }

  #screen-loading { text-align: center; color: var(--text-dim); padding: 40px 0; }

  #screen-start .card { text-align: center; }
  #screen-start h2 { margin-top: 0; }

  .progress {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .musical-tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #1f1329;
    color: var(--text);
    font-size: 0.98rem;
    cursor: pointer;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent-dim); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn { position: relative; transition: transform 0.15s ease; }
  .choice-btn.correct {
    background: rgba(76, 175, 125, 0.32);
    border-color: var(--correct);
    border-width: 2px;
    color: #eafff2;
    font-weight: 700;
    animation: choice-pop 0.35s ease;
  }
  .choice-btn.incorrect {
    background: rgba(217, 83, 79, 0.32);
    border-color: var(--incorrect);
    border-width: 2px;
    color: #ffecec;
    font-weight: 700;
    animation: choice-shake 0.4s ease;
  }
  .choice-btn.correct::after,
  .choice-btn.incorrect::after {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.15rem;
  }
  .choice-btn.correct::after { content: "◯"; color: var(--correct); }
  .choice-btn.incorrect::after { content: "✕"; color: var(--incorrect); }
  @keyframes choice-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  @keyframes choice-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .quiz-feedback {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .quiz-feedback.correct { background: rgba(76, 175, 125, 0.16); color: var(--correct); border: 1px solid var(--correct); }
  .quiz-feedback.incorrect { background: rgba(217, 83, 79, 0.16); color: var(--incorrect); border: 1px solid var(--incorrect); }

  .explanation {
    margin-top: 12px;
    padding: 12px 14px;
    background: #17101d;
    border-radius: 10px;
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .result-score {
    text-align: center;
    margin-bottom: 22px;
  }
  .result-score .big {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
  }
  .leaderboard { margin-top: 22px; }
  .leaderboard h3 { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 10px; }
  .leaderboard ol { margin: 0; padding-left: 22px; }
  .leaderboard li {
    padding: 6px 0;
    font-size: 0.92rem;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
  }
  .leaderboard li:last-child { border-bottom: none; }

  .error-toast {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(217, 83, 79, 0.15);
    border: 1px solid var(--incorrect);
    border-radius: 10px;
    font-size: 0.85rem;
    color: #f3c9c8;
  }
  .hidden { display: none !important; }
  .spacer { height: 14px; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎭 <span>ミュージカル</span>クイズ</h1>
    </header>

    <div class="bgm-bar">
      <span class="bgm-bar-label">🎵 BGM</span>
      <button id="btn-bgm-orchestra" class="bgm-pill" type="button" data-track="orchestra">
        <span class="bgm-icon">🔈</span>オケ風
      </button>
      <button id="btn-bgm-paris" class="bgm-pill" type="button" data-track="paris">
        <span class="bgm-icon">🔈</span>パリ風
      </button>
      <button id="btn-bgm-stop" class="bgm-pill bgm-pill-stop hidden" type="button">停止</button>
    </div>

    <audio id="audio-orchestra" src="./bgmorchestra.mp3" loop preload="none"></audio>
    <audio id="audio-paris" src="./bgmparis.mp3" loop preload="none"></audio>

    <div id="screen-loading">
      <p>読み込み中...</p>
    </div>

    <div id="screen-start" class="hidden">
      <div class="hero">
        <div class="hero-glow"></div>
        <div class="hero-notes"><span>♪</span><span>♫</span><span>♪</span><span>♬</span></div>
        <span class="hero-emoji">🎟️🎶🎭</span>
        <p class="hero-tagline">さあ、幕を開けよう</p>
      </div>
      <div class="card">
        <h2>クイズを始めよう</h2>
        <p class="muted">選んだ段位から挑戦スタート。5問中4問正解で次の段位に進めます。すべて突破すると「ミュージカル博士」の称号がもらえます！</p>

        <div class="difficulty-select" id="difficulty-select">
          <button type="button" class="difficulty-pill" data-difficulty="初級">初級</button>
          <button type="button" class="difficulty-pill" data-difficulty="中級">中級</button>
          <button type="button" class="difficulty-pill" data-difficulty="上級">上級</button>
          <button type="button" class="difficulty-pill" data-difficulty="超級">超級</button>
        </div>

        <label for="input-player-name" class="muted" style="display:block;text-align:left;margin-bottom:6px;font-size:0.85rem;">
          お名前（入力するとランキングに載ります。空欄ならゲスト参加）
        </label>
        <input
          id="input-player-name"
          type="text"
          maxlength="20"
          placeholder="例）びっきぃ"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--panel-border);background:#1f1329;color:var(--text);font-size:0.98rem;margin-bottom:14px;"
        />

        <button id="btn-start-named" class="btn btn-primary" disabled>この名前でプレイ</button>
        <div class="spacer"></div>
        <button id="btn-start-guest" class="btn btn-secondary">ゲストとして始める</button>
        <div class="spacer"></div>
        <button id="btn-view-leaderboard" class="btn btn-secondary">ランキングを見る</button>
      </div>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="card">
        <div class="progress" id="quiz-progress">問題 1 / 5</div>
        <div class="musical-tag" id="quiz-musical"></div>
        <p class="question-text" id="quiz-question"></p>
        <div class="choices" id="quiz-choices"></div>
        <div class="quiz-feedback hidden" id="quiz-feedback"></div>
        <div class="explanation hidden" id="quiz-explanation"></div>
        <div class="spacer"></div>
        <button id="btn-next" class="btn btn-primary hidden">次へ</button>
      </div>
    </div>

    <div id="screen-tier-clear" class="hidden">
      <div class="card">
        <div class="tier-clear-emoji">🎉</div>
        <h2 id="tier-clear-title">突破！</h2>
        <p class="muted" id="tier-clear-detail"></p>
        <button id="btn-next-tier" class="btn btn-primary">次の段位へ挑戦</button>
      </div>
    </div>

    <div id="screen-result" class="hidden">
      <div class="card">
        <div class="result-score">
          <div class="muted">通算正解数</div>
          <div class="big" id="result-score-value">0</div>
          <div class="muted" id="result-detail"></div>
          <div class="result-badge" id="result-badge"></div>
        </div>
        <button id="btn-again" class="btn btn-primary">もう一度遊ぶ</button>
        <div class="leaderboard">
          <h3>🏆 ランキング（トップ5）</h3>
          <ol id="leaderboard-list"></ol>
        </div>
      </div>
    </div>

    <div id="error-box" class="error-toast hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";

    // ------------------------------------------------------------
    // 設定: あなたのSupabaseプロジェクトの情報
    // ------------------------------------------------------------
    var SUPABASE_URL = "https://vgmbcbseikcjkjxbyrjx.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_oNXZ4n-XITyKLgLRtKgVVw_UPokBcTL";
    var QUESTIONS_PER_ROUND = 5;
    var PASS_MIN_CORRECT = 4;
    var DIFFICULTY_LEVELS = ["初級", "中級", "上級", "超級"];
    var TIER_BADGE = { "初級": "🔰", "中級": "⭐", "上級": "🌟", "超級": "👑" };

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ------------------------------------------------------------
    // BGM（AIで作成した楽曲を選んで再生）
    // ------------------------------------------------------------
    var audioOrchestra = document.getElementById("audio-orchestra");
    var audioParis = document.getElementById("audio-paris");
    var btnBgmOrchestra = document.getElementById("btn-bgm-orchestra");
    var btnBgmParis = document.getElementById("btn-bgm-paris");
    var btnBgmStop = document.getElementById("btn-bgm-stop");

    var BGM_TRACKS = {
      orchestra: { audio: audioOrchestra, button: btnBgmOrchestra },
      paris: { audio: audioParis, button: btnBgmParis }
    };
    var currentBgmKey = null;

    function updateBgmButtons() {
      Object.keys(BGM_TRACKS).forEach(function (key) {
        var track = BGM_TRACKS[key];
        var playing = currentBgmKey === key;
        track.button.classList.toggle("playing", playing);
        track.button.setAttribute("aria-pressed", playing ? "true" : "false");
        track.button.querySelector(".bgm-icon").textContent = playing ? "🔊" : "🔈";
      });
      btnBgmStop.classList.toggle("hidden", !currentBgmKey);
    }

    function stopAllBgm() {
      Object.keys(BGM_TRACKS).forEach(function (key) {
        var audio = BGM_TRACKS[key].audio;
        audio.pause();
        audio.currentTime = 0;
      });
      currentBgmKey = null;
      updateBgmButtons();
    }

    function playBgm(key) {
      Object.keys(BGM_TRACKS).forEach(function (k) {
        if (k !== key) {
          BGM_TRACKS[k].audio.pause();
          BGM_TRACKS[k].audio.currentTime = 0;
        }
      });
      var playPromise = BGM_TRACKS[key].audio.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function () {
          // 自動再生がブロックされた場合などは静かに無視（ボタン操作は反映済み）
        });
      }
      currentBgmKey = key;
      updateBgmButtons();
    }

    function toggleBgm(key) {
      if (currentBgmKey === key) {
        stopAllBgm();
      } else {
        playBgm(key);
      }
    }

    btnBgmOrchestra.addEventListener("click", function () {
      toggleBgm("orchestra");
    });
    btnBgmParis.addEventListener("click", function () {
      toggleBgm("paris");
    });
    btnBgmStop.addEventListener("click", function () {
      stopAllBgm();
    });

    // ------------------------------------------------------------
    // DOM参照
    // ------------------------------------------------------------
    var el = {
      loading: document.getElementById("screen-loading"),
      start: document.getElementById("screen-start"),
      quiz: document.getElementById("screen-quiz"),
      tierClear: document.getElementById("screen-tier-clear"),
      result: document.getElementById("screen-result"),
      difficultySelect: document.getElementById("difficulty-select"),
      inputPlayerName: document.getElementById("input-player-name"),
      btnStartNamed: document.getElementById("btn-start-named"),
      btnStartGuest: document.getElementById("btn-start-guest"),
      btnViewLeaderboard: document.getElementById("btn-view-leaderboard"),
      btnAgain: document.getElementById("btn-again"),
      btnNext: document.getElementById("btn-next"),
      btnNextTier: document.getElementById("btn-next-tier"),
      tierClearTitle: document.getElementById("tier-clear-title"),
      tierClearDetail: document.getElementById("tier-clear-detail"),
      quizProgress: document.getElementById("quiz-progress"),
      quizMusical: document.getElementById("quiz-musical"),
      quizQuestion: document.getElementById("quiz-question"),
      quizChoices: document.getElementById("quiz-choices"),
      quizFeedback: document.getElementById("quiz-feedback"),
      quizExplanation: document.getElementById("quiz-explanation"),
      resultScoreValue: document.getElementById("result-score-value"),
      resultDetail: document.getElementById("result-detail"),
      resultBadge: document.getElementById("result-badge"),
      leaderboardList: document.getElementById("leaderboard-list"),
      errorBox: document.getElementById("error-box"),
    };

    var state = {
      playerName: null,
      selectedDifficulty: "初級",
      startDifficulty: null,
      pool: null,
      currentLevelIndex: 0,
      questions: [],
      currentIndex: 0,
      tierCorrectCount: 0,
      totalCorrect: 0,
      totalQuestions: 0,
      reachedLevel: 0,
      clearedTop: false,
      sessionId: null,
      startedAt: null,
      pendingAnswers: [],
      answered: false,
    };

    function showScreen(name) {
      ["loading", "start", "quiz", "tierClear", "result"].forEach(function (key) {
        el[key].classList.toggle("hidden", key !== name);
      });
    }

    // ------------------------------------------------------------
    // 難易度選択（開始段位）
    // ------------------------------------------------------------
    var difficultyButtons = el.difficultySelect.querySelectorAll(".difficulty-pill");
    function setSelectedDifficulty(value) {
      state.selectedDifficulty = value;
      difficultyButtons.forEach(function (b) {
        b.classList.toggle("selected", b.getAttribute("data-difficulty") === value);
      });
    }
    difficultyButtons.forEach(function (b) {
      b.addEventListener("click", function () {
        setSelectedDifficulty(b.getAttribute("data-difficulty"));
      });
    });
    setSelectedDifficulty(state.selectedDifficulty);

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      // 古いブラウザ向けの簡易フォールバック
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function showError(message) {
      el.errorBox.textContent = message;
      el.errorBox.classList.remove("hidden");
      window.setTimeout(function () {
        el.errorBox.classList.add("hidden");
      }, 6000);
    }

    function shuffle(array) {
      var copy = array.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    // ------------------------------------------------------------
    // 開始画面（名前入力 / ゲスト）
    // ------------------------------------------------------------
    el.inputPlayerName.addEventListener("input", function () {
      el.btnStartNamed.disabled = el.inputPlayerName.value.trim().length === 0;
    });

    el.inputPlayerName.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !el.btnStartNamed.disabled) {
        e.preventDefault();
        startQuiz(el.inputPlayerName.value.trim());
      }
    });

    el.btnStartNamed.addEventListener("click", function () {
      var name = el.inputPlayerName.value.trim();
      if (!name) return;
      startQuiz(name);
    });

    el.btnStartGuest.addEventListener("click", function () {
      startQuiz(null);
    });

    el.btnAgain.addEventListener("click", function () {
      el.inputPlayerName.value = state.playerName || "";
      el.btnStartNamed.disabled = !state.playerName;
      setSelectedDifficulty(state.startDifficulty || "初級");
      showScreen("start");
    });

    el.btnViewLeaderboard.addEventListener("click", function () {
      loadLeaderboard().then(function () {
        el.resultScoreValue.textContent = "-";
        el.resultDetail.textContent = "";
        el.resultBadge.textContent = "";
        showScreen("result");
      });
    });

    function startQuiz(playerName) {
      state.playerName = playerName;
      state.startDifficulty = state.selectedDifficulty;
      state.currentLevelIndex = DIFFICULTY_LEVELS.indexOf(state.selectedDifficulty);
      if (state.currentLevelIndex < 0) state.currentLevelIndex = 0;
      state.totalCorrect = 0;
      state.totalQuestions = 0;
      state.reachedLevel = 0;
      state.clearedTop = false;
      state.pendingAnswers = [];
      state.sessionId = generateUUID();
      state.startedAt = new Date().toISOString();
      showScreen("loading");

      supabase
        .from("questions")
        .select("id, question_text, explanation, difficulty, choices(id, choice_text, is_correct, sort_order)")
        .then(function (res) {
          if (res.error) throw res.error;
          if (!res.data || res.data.length === 0) {
            throw new Error("問題データが見つかりませんでした。");
          }
          var pool = {};
          DIFFICULTY_LEVELS.forEach(function (level) { pool[level] = []; });
          res.data.forEach(function (q) {
            q.choices = q.choices.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
            if (pool[q.difficulty]) pool[q.difficulty].push(q);
          });
          state.pool = pool;

          startTierRound();
        })
        .catch(function (err) {
          showError("クイズの開始に失敗しました: " + err.message);
          showScreen("start");
        });
    }

    function startTierRound() {
      var level = DIFFICULTY_LEVELS[state.currentLevelIndex];
      var bucket = (state.pool && state.pool[level]) || [];
      if (bucket.length === 0) {
        showError("「" + level + "」の問題データが見つかりませんでした。");
        showScreen("start");
        return;
      }
      state.questions = shuffle(bucket).slice(0, Math.min(QUESTIONS_PER_ROUND, bucket.length));
      state.currentIndex = 0;
      state.tierCorrectCount = 0;

      renderQuestion();
      showScreen("quiz");
    }

    function renderQuestion() {
      state.answered = false;
      var level = DIFFICULTY_LEVELS[state.currentLevelIndex];
      var q = state.questions[state.currentIndex];
      el.quizProgress.textContent =
        level + " - 問題 " + (state.currentIndex + 1) + " / " + state.questions.length;
      el.quizMusical.textContent = TIER_BADGE[level] + " " + level;
      el.quizQuestion.textContent = q.question_text;
      el.quizExplanation.classList.add("hidden");
      el.quizExplanation.textContent = "";
      el.quizFeedback.classList.add("hidden");
      el.quizFeedback.className = "quiz-feedback hidden";
      el.quizFeedback.textContent = "";
      el.btnNext.classList.add("hidden");

      el.quizChoices.innerHTML = "";
      shuffle(q.choices).forEach(function (choice) {
        var btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice.choice_text;
        btn.addEventListener("click", function () {
          selectChoice(q, choice, btn);
        });
        el.quizChoices.appendChild(btn);
      });
    }

    function selectChoice(question, choice, btnEl) {
      if (state.answered) return;
      state.answered = true;

      var buttons = el.quizChoices.querySelectorAll(".choice-btn");
      buttons.forEach(function (b) { b.disabled = true; });

      question.choices.forEach(function (c, idx) {
        if (c.is_correct) {
          var match = Array.prototype.find.call(buttons, function (b) { return b.textContent === c.choice_text; });
          if (match) match.classList.add("correct");
        }
      });
      if (!choice.is_correct) btnEl.classList.add("incorrect");
      if (choice.is_correct) {
        state.tierCorrectCount += 1;
        state.totalCorrect += 1;
      }

      if (choice.is_correct) {
        el.quizFeedback.textContent = "◯ 正解！";
        el.quizFeedback.className = "quiz-feedback correct";
      } else {
        var correctChoice = question.choices.filter(function (c) { return c.is_correct; })[0];
        el.quizFeedback.textContent = "✕ 不正解… 正解は「" + (correctChoice ? correctChoice.choice_text : "?") + "」";
        el.quizFeedback.className = "quiz-feedback incorrect";
      }

      if (question.explanation) {
        el.quizExplanation.textContent = question.explanation;
        el.quizExplanation.classList.remove("hidden");
      }
      el.btnNext.classList.remove("hidden");
      el.btnNext.textContent = state.currentIndex === state.questions.length - 1 ? "結果を確認する" : "次へ";

      state.pendingAnswers.push({
        session_id: state.sessionId,
        question_id: question.id,
        selected_choice_id: choice.id,
        is_correct: choice.is_correct,
      });
    }

    el.btnNext.addEventListener("click", function () {
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        evaluateTierRound();
      }
    });

    function evaluateTierRound() {
      state.totalQuestions += state.questions.length;
      var level = DIFFICULTY_LEVELS[state.currentLevelIndex];
      var passed = state.tierCorrectCount >= PASS_MIN_CORRECT;

      if (!passed) {
        finishQuiz();
        return;
      }

      state.reachedLevel = state.currentLevelIndex + 1;

      if (state.currentLevelIndex >= DIFFICULTY_LEVELS.length - 1) {
        state.clearedTop = true;
        finishQuiz();
        return;
      }

      var nextLevel = DIFFICULTY_LEVELS[state.currentLevelIndex + 1];
      el.tierClearTitle.textContent = TIER_BADGE[level] + " " + level + "突破！";
      el.tierClearDetail.textContent =
        level + "で" + state.tierCorrectCount + "/" + state.questions.length + "問正解。次は「" + nextLevel + "」に挑戦できます。";
      showScreen("tierClear");
    }

    el.btnNextTier.addEventListener("click", function () {
      state.currentLevelIndex += 1;
      startTierRound();
    });

    function finishQuiz() {
      showScreen("loading");

      function showResult() {
        el.resultScoreValue.textContent = state.totalCorrect;
        el.resultDetail.textContent =
          state.totalCorrect + " / " + state.totalQuestions + " 問正解（通算）" +
          (state.playerName ? "" : "（ゲスト参加のためランキング対象外です）");

        if (state.clearedTop) {
          el.resultBadge.textContent = "🎓 ミュージカル博士！全段位クリア";
        } else if (state.reachedLevel > 0) {
          var reachedLabel = DIFFICULTY_LEVELS[state.reachedLevel - 1];
          el.resultBadge.textContent = TIER_BADGE[reachedLabel] + " " + reachedLabel + "突破";
        } else {
          el.resultBadge.textContent = DIFFICULTY_LEVELS[state.currentLevelIndex] + "で敗退…";
        }

        showScreen("result");
      }

      supabase
        .from("quiz_sessions")
        .insert({
          id: state.sessionId,
          player_name: state.playerName,
          start_difficulty: state.startDifficulty,
          reached_level: state.reachedLevel,
          reached_difficulty: state.reachedLevel > 0 ? DIFFICULTY_LEVELS[state.reachedLevel - 1] : null,
          cleared_top: state.clearedTop,
          total_questions: state.totalQuestions,
          correct_count: state.totalCorrect,
          score: state.totalCorrect * 20,
          started_at: state.startedAt,
          finished_at: new Date().toISOString(),
        })
        .then(function (res) {
          if (res.error) throw res.error;
          if (state.pendingAnswers.length > 0) {
            return supabase.from("quiz_answers").insert(state.pendingAnswers);
          }
        })
        .then(function () {
          return loadLeaderboard();
        })
        .then(showResult)
        .catch(function (err) {
          showError("結果の保存に失敗しました: " + err.message);
          showResult();
        });
    }

    function loadLeaderboard() {
      return supabase
        .from("leaderboard")
        .select("*")
        .order("reached_level", { ascending: false })
        .order("correct_count", { ascending: false })
        .limit(5)
        .then(function (res) {
          el.leaderboardList.innerHTML = "";
          if (res.error || !res.data || res.data.length === 0) {
            var li = document.createElement("li");
            li.textContent = "まだ記録がありません";
            el.leaderboardList.appendChild(li);
            return;
          }
          res.data.forEach(function (row) {
            var li = document.createElement("li");
            var nameSpan = document.createElement("span");
            nameSpan.textContent = row.display_name || "プレイヤー";
            var badgeSpan = document.createElement("span");
            var label;
            if (row.cleared_top) {
              label = "🎓 博士（" + row.correct_count + "/" + row.total_questions + "）";
            } else if (row.reached_difficulty) {
              label = TIER_BADGE[row.reached_difficulty] + " " + row.reached_difficulty + "突破（" + row.correct_count + "/" + row.total_questions + "）";
            } else {
              label = "挑戦中（" + row.correct_count + "/" + row.total_questions + "）";
            }
            badgeSpan.textContent = label;
            li.appendChild(nameSpan);
            li.appendChild(badgeSpan);
            el.leaderboardList.appendChild(li);
          });
        });
    }

    // ------------------------------------------------------------
    // 初期化
    // ------------------------------------------------------------
    showScreen("start");
  })();
  </script>
</body>
</html>
