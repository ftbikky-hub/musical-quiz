<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミュージカルクイズ</title>
<style>
  :root {
    --bg: #1b1023;
    --panel: #2a1a38;
    --panel-border: #45304f;
    --accent: #d9a441;
    --accent-dim: #a97e2f;
    --text: #f4ecf7;
    --text-dim: #c9b8d1;
    --correct: #4caf7d;
    --incorrect: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a1a38 0%, #170c20 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  .user-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .user-box img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #241329; }
  .btn-primary:hover:not(:disabled) { background: #e6b458; }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    font-weight: 500;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--accent-dim); }
  .btn-github {
    background: #24292e;
    color: #fff;
  }
  .btn-github:hover { background: #33383f; }
  .btn-github svg { width: 18px; height: 18px; }

  .muted { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; }

  #screen-loading { text-align: center; color: var(--text-dim); padding: 40px 0; }

  #screen-auth .card, #screen-start .card { text-align: center; }
  #screen-auth h2, #screen-start h2 { margin-top: 0; }

  .progress {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .musical-tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #1f1329;
    color: var(--text);
    font-size: 0.98rem;
    cursor: pointer;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent-dim); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: rgba(76, 175, 125, 0.18); border-color: var(--correct); }
  .choice-btn.incorrect { background: rgba(217, 83, 79, 0.18); border-color: var(--incorrect); }

  .explanation {
    margin-top: 16px;
    padding: 12px 14px;
    background: #17101d;
    border-radius: 10px;
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .result-score {
    text-align: center;
    margin-bottom: 22px;
  }
  .result-score .big {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
  }
  .leaderboard { margin-top: 22px; }
  .leaderboard h3 { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 10px; }
  .leaderboard ol { margin: 0; padding-left: 22px; }
  .leaderboard li {
    padding: 6px 0;
    font-size: 0.92rem;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
  }
  .leaderboard li:last-child { border-bottom: none; }

  .error-toast {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(217, 83, 79, 0.15);
    border: 1px solid var(--incorrect);
    border-radius: 10px;
    font-size: 0.85rem;
    color: #f3c9c8;
  }
  .hidden { display: none !important; }
  .spacer { height: 14px; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎭 <span>ミュージカル</span>クイズ</h1>
      <div id="user-box" class="user-box hidden">
        <img id="user-avatar" src="" alt="" />
        <span id="user-name"></span>
        <button id="btn-signout" class="btn-secondary" style="width:auto;padding:6px 10px;font-size:0.8rem;">ログアウト</button>
      </div>
    </header>

    <div id="screen-loading">
      <p>読み込み中...</p>
    </div>

    <div id="screen-auth" class="hidden">
      <div class="card">
        <h2>ようこそ</h2>
        <p class="muted">GitHubアカウントでログインすると、クイズに挑戦してスコアを記録できます。</p>
        <button id="btn-signin" class="btn btn-github">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHubでログイン
        </button>
      </div>
    </div>

    <div id="screen-start" class="hidden">
      <div class="card">
        <h2>クイズを始めよう</h2>
        <p class="muted">全10問の中からランダムで5問出題されます。ミュージカルの知識を試してみましょう。</p>
        <button id="btn-start" class="btn btn-primary">クイズを始める</button>
        <div class="spacer"></div>
        <button id="btn-view-leaderboard" class="btn btn-secondary">ランキングを見る</button>
      </div>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="card">
        <div class="progress" id="quiz-progress">問題 1 / 5</div>
        <div class="musical-tag" id="quiz-musical"></div>
        <p class="question-text" id="quiz-question"></p>
        <div class="choices" id="quiz-choices"></div>
        <div class="explanation hidden" id="quiz-explanation"></div>
        <div class="spacer"></div>
        <button id="btn-next" class="btn btn-primary hidden">次へ</button>
      </div>
    </div>

    <div id="screen-result" class="hidden">
      <div class="card">
        <div class="result-score">
          <div class="muted">今回のスコア</div>
          <div class="big" id="result-score-value">0</div>
          <div class="muted" id="result-detail"></div>
        </div>
        <button id="btn-again" class="btn btn-primary">もう一度遊ぶ</button>
        <div class="leaderboard">
          <h3>🏆 ランキング（トップ5）</h3>
          <ol id="leaderboard-list"></ol>
        </div>
      </div>
    </div>

    <div id="error-box" class="error-toast hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";

    // ------------------------------------------------------------
    // 設定: あなたのSupabaseプロジェクトの情報
    // ------------------------------------------------------------
    var SUPABASE_URL = "https://vgmbcbseikcjkjxbyrjx.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_oNXZ4n-XITyKLgLRtKgVVw_UPokBcTL";
    var QUESTIONS_PER_ROUND = 5;

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ------------------------------------------------------------
    // DOM参照
    // ------------------------------------------------------------
    var el = {
      loading: document.getElementById("screen-loading"),
      auth: document.getElementById("screen-auth"),
      start: document.getElementById("screen-start"),
      quiz: document.getElementById("screen-quiz"),
      result: document.getElementById("screen-result"),
      userBox: document.getElementById("user-box"),
      userAvatar: document.getElementById("user-avatar"),
      userName: document.getElementById("user-name"),
      btnSignin: document.getElementById("btn-signin"),
      btnSignout: document.getElementById("btn-signout"),
      btnStart: document.getElementById("btn-start"),
      btnViewLeaderboard: document.getElementById("btn-view-leaderboard"),
      btnAgain: document.getElementById("btn-again"),
      btnNext: document.getElementById("btn-next"),
      quizProgress: document.getElementById("quiz-progress"),
      quizMusical: document.getElementById("quiz-musical"),
      quizQuestion: document.getElementById("quiz-question"),
      quizChoices: document.getElementById("quiz-choices"),
      quizExplanation: document.getElementById("quiz-explanation"),
      resultScoreValue: document.getElementById("result-score-value"),
      resultDetail: document.getElementById("result-detail"),
      leaderboardList: document.getElementById("leaderboard-list"),
      errorBox: document.getElementById("error-box"),
    };

    var state = {
      session: null,
      questions: [],
      currentIndex: 0,
      correctCount: 0,
      sessionId: null,
      answered: false,
    };

    function showScreen(name) {
      ["loading", "auth", "start", "quiz", "result"].forEach(function (key) {
        el[key].classList.toggle("hidden", key !== name);
      });
    }

    function showError(message) {
      el.errorBox.textContent = message;
      el.errorBox.classList.remove("hidden");
      window.setTimeout(function () {
        el.errorBox.classList.add("hidden");
      }, 6000);
    }

    function shuffle(array) {
      var copy = array.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    // ------------------------------------------------------------
    // 認証まわり
    // ------------------------------------------------------------
    function updateUserBox(session) {
      if (session && session.user) {
        var meta = session.user.user_metadata || {};
        el.userAvatar.src = meta.avatar_url || "";
        el.userName.textContent = meta.user_name || meta.full_name || session.user.email || "プレイヤー";
        el.userBox.classList.remove("hidden");
      } else {
        el.userBox.classList.add("hidden");
      }
    }

    function renderAuthState(session) {
      state.session = session;
      updateUserBox(session);
      if (session) {
        showScreen("start");
      } else {
        showScreen("auth");
      }
    }

    el.btnSignin.addEventListener("click", function () {
      supabase.auth.signInWithOAuth({ provider: "github" }).then(function (res) {
        if (res.error) showError("ログインに失敗しました: " + res.error.message);
      });
    });

    el.btnSignout.addEventListener("click", function () {
      supabase.auth.signOut().then(function () {
        renderAuthState(null);
      });
    });

    // ------------------------------------------------------------
    // クイズ開始
    // ------------------------------------------------------------
    el.btnStart.addEventListener("click", startQuiz);
    el.btnAgain.addEventListener("click", startQuiz);
    el.btnViewLeaderboard.addEventListener("click", function () {
      loadLeaderboard().then(function () {
        el.resultScoreValue.textContent = "-";
        el.resultDetail.textContent = "";
        showScreen("result");
      });
    });

    function startQuiz() {
      if (!state.session) {
        showError("先にGitHubでログインしてください。");
        return;
      }
      showScreen("loading");

      supabase
        .from("questions")
        .select("id, question_text, explanation, musicals(title), choices(id, choice_text, is_correct, sort_order)")
        .then(function (res) {
          if (res.error) throw res.error;
          if (!res.data || res.data.length === 0) {
            throw new Error("問題データが見つかりませんでした。");
          }
          var picked = shuffle(res.data).slice(0, QUESTIONS_PER_ROUND);
          picked.forEach(function (q) {
            q.choices = q.choices.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
          });
          state.questions = picked;
          state.currentIndex = 0;
          state.correctCount = 0;

          return supabase
            .from("quiz_sessions")
            .insert({ user_id: state.session.user.id, total_questions: picked.length })
            .select()
            .single();
        })
        .then(function (res) {
          if (res.error) throw res.error;
          state.sessionId = res.data.id;
          renderQuestion();
          showScreen("quiz");
        })
        .catch(function (err) {
          showError("クイズの開始に失敗しました: " + err.message);
          showScreen("start");
        });
    }

    function renderQuestion() {
      state.answered = false;
      var q = state.questions[state.currentIndex];
      el.quizProgress.textContent = "問題 " + (state.currentIndex + 1) + " / " + state.questions.length;
      el.quizMusical.textContent = q.musicals ? q.musicals.title : "";
      el.quizQuestion.textContent = q.question_text;
      el.quizExplanation.classList.add("hidden");
      el.quizExplanation.textContent = "";
      el.btnNext.classList.add("hidden");

      el.quizChoices.innerHTML = "";
      shuffle(q.choices).forEach(function (choice) {
        var btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice.choice_text;
        btn.addEventListener("click", function () {
          selectChoice(q, choice, btn);
        });
        el.quizChoices.appendChild(btn);
      });
    }

    function selectChoice(question, choice, btnEl) {
      if (state.answered) return;
      state.answered = true;

      var buttons = el.quizChoices.querySelectorAll(".choice-btn");
      buttons.forEach(function (b) { b.disabled = true; });

      question.choices.forEach(function (c, idx) {
        if (c.is_correct) {
          var match = Array.prototype.find.call(buttons, function (b) { return b.textContent === c.choice_text; });
          if (match) match.classList.add("correct");
        }
      });
      if (!choice.is_correct) btnEl.classList.add("incorrect");
      if (choice.is_correct) state.correctCount += 1;

      if (question.explanation) {
        el.quizExplanation.textContent = question.explanation;
        el.quizExplanation.classList.remove("hidden");
      }
      el.btnNext.classList.remove("hidden");
      el.btnNext.textContent = state.currentIndex === state.questions.length - 1 ? "結果を見る" : "次へ";

      supabase
        .from("quiz_answers")
        .insert({
          session_id: state.sessionId,
          question_id: question.id,
          selected_choice_id: choice.id,
          is_correct: choice.is_correct,
        })
        .then(function (res) {
          if (res.error) console.error("回答の保存に失敗:", res.error.message);
        });
    }

    el.btnNext.addEventListener("click", function () {
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        finishQuiz();
      }
    });

    function finishQuiz() {
      showScreen("loading");
      var score = state.correctCount * 20;

      supabase
        .from("quiz_sessions")
        .update({
          correct_count: state.correctCount,
          score: score,
          finished_at: new Date().toISOString(),
        })
        .eq("id", state.sessionId)
        .then(function (res) {
          if (res.error) throw res.error;
          return loadLeaderboard();
        })
        .then(function () {
          el.resultScoreValue.textContent = score;
          el.resultDetail.textContent = state.correctCount + " / " + state.questions.length + " 問正解";
          showScreen("result");
        })
        .catch(function (err) {
          showError("結果の保存に失敗しました: " + err.message);
          el.resultScoreValue.textContent = score;
          el.resultDetail.textContent = state.correctCount + " / " + state.questions.length + " 問正解";
          showScreen("result");
        });
    }

    function loadLeaderboard() {
      return supabase
        .from("leaderboard")
        .select("*")
        .order("best_score", { ascending: false })
        .limit(5)
        .then(function (res) {
          el.leaderboardList.innerHTML = "";
          if (res.error || !res.data || res.data.length === 0) {
            var li = document.createElement("li");
            li.textContent = "まだ記録がありません";
            el.leaderboardList.appendChild(li);
            return;
          }
          res.data.forEach(function (row) {
            var li = document.createElement("li");
            var nameSpan = document.createElement("span");
            nameSpan.textContent = row.display_name || "プレイヤー";
            var scoreSpan = document.createElement("span");
            scoreSpan.textContent = row.best_score + "点";
            li.appendChild(nameSpan);
            li.appendChild(scoreSpan);
            el.leaderboardList.appendChild(li);
          });
        });
    }

    // ------------------------------------------------------------
    // 初期化
    // ------------------------------------------------------------
    supabase.auth.getSession().then(function (res) {
      renderAuthState(res.data.session);
    }).catch(function (err) {
      showError("Supabaseへの接続に失敗しました: " + err.message);
      showScreen("auth");
    });

    supabase.auth.onAuthStateChange(function (event, session) {
      renderAuthState(session);
    });
  })();
  </script>
</body>
</html>
